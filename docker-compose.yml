# Local development stack. Secrets come from .env (gitignored); see .env.example.
# First start of an empty postgres-data volume runs infra/local/postgres/init/*.sql once.
# Changing passwords in .env later does NOT update existing users: run `docker compose down -v`.

services:
  postgres:
    image: postgres:16
    environment:
      
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by 01-databases.sql via psql \getenv
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}
      QUIZ_DB_PASSWORD: ${QUIZ_DB_PASSWORD:?set QUIZ_DB_PASSWORD in .env}
      SESSION_DB_PASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
      SCORING_DB_PASSWORD: ${SCORING_DB_PASSWORD:?set SCORING_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: during init the temporary server listens on the unix socket only,
      # so this stays unhealthy until init has finished and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      # redis-cli reads the password from here, so the healthcheck needs no -a flag
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    # Two Kafka listeners, because a client connects to whatever address the broker advertises:
    #   external: host apps  -> localhost:9092 (published)
    #   internal: containers -> redpanda:29092 (compose network only)
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # --- Observability (profile "obs": .\tasks.ps1 obs). Images pinned to the latest stable tags on Docker Hub as of
  # 2026-10-02 (hub.docker.com/v2/repositories/<image>/tags). Config in infra/local/observability/.

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Keep the exemplars (sample trace ids) the services attach to histogram buckets: Grafana links them to Jaeger.
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    extra_hosts:
      # The services run on the host. Docker Desktop provides this name; on Linux, this line does.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/local/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Jaeger v2: one process holding the OTLP receiver, in-memory storage and the UI. Traces are lost on restart: fine
  # for a local stack. The services send OTLP over HTTP to localhost:4318 (MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_
  # OTLP_ENDPOINT in .env). No healthcheck: the image has no shell or HTTP client to run one with.
  # 2.20.0, NOT the newer 2.21.0: 2.21.0 removed the v1 HTTP API (/api/services, /api/traces; release notes, #9260),
  # which is what Grafana's Jaeger datasource calls. Its own UI moved to /api/v3. Revisit when Grafana's datasource does.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: [obs]
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP over HTTP

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana 13 replaces bundled core plugins (prometheus among them) with downloads from grafana.com at startup.
      # When that download failed, the bundled Prometheus plugin was gone and the datasource broke. Use the bundled
      # ones and download nothing: the stack also starts offline.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "3000:3000"
    # No data volume on purpose: datasources and dashboards come from files on every start, and the admin password
    # from .env applies every time (Grafana only reads it when it creates its database).
    volumes:
      - ./infra/local/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/local/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || curl -fs http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  prometheus-data:
