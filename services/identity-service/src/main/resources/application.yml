spring:
  application:
    name: identity-service
  datasource:
    # Non-secret local defaults; the password has no default and must come from the environment.
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${IDENTITY_DB_USERNAME:identity_app}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

identity:
  jwt:
    # Spring resource locations (file:...), set per machine or container; see .env.example.
    # No defaults: the service must not start without its signing keys.
    private-key-location: ${IDENTITY_JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION}
    issuer: buzzer-identity
    access-token-ttl: 15m
    guest-token-ttl: 3h
    # Sliding: every refresh issues a new token valid for another 7 days.
    refresh-token-ttl: 7d

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
