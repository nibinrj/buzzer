spring:
  application:
    name: session-service
  datasource:
    # Non-secret local defaults; the password has no default and must come from the environment.
    url: ${SESSION_DB_URL:jdbc:postgresql://localhost:5432/session_db}
    username: ${SESSION_DB_USERNAME:session_app}
    password: ${SESSION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      # Non-secret local defaults; the password has no default and must come from the environment.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  kafka:
    # Local default: docker-compose's Redpanda (its external listener). In AWS, MSK's bootstrap brokers.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # ScoreUpdatedListener: one group for all session-service tasks, so each leaderboard is read once and
      # then fanned out through the Redis relay.
      group-id: session-service
      # A brand-new group (first deploy) starts at the newest record: old leaderboards are worth nothing as pushes.
      # An existing group continues from its committed offset either way.
      auto-offset-reset: latest
      # Keys and values are Strings (Boot's default deserializers): ScoreUpdatedListener parses the JSON itself.
    producer:
      # Keys and values are Strings (Boot's default serializers): the outbox already holds the JSON.
      # acks=all: acknowledged only once every in-sync replica has the record. Only then is a row marked sent.
      acks: all
      properties:
        # Fail a send within seconds, not the client defaults (up to 60 s blocked, 120 s delivery), so a run of
        # OutboxPublisher gives up quickly while Kafka is down and holds its row locks only briefly.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  cloud:
    circuitbreaker:
      resilience4j:
        # Run the quiz-service call on the request thread. By default Spring Cloud runs it on a thread pool
        # under a TimeLimiter (1 s); we bound it with the HTTP client's own timeouts instead (QuizClientProperties).
        disable-time-limiter: true
        disable-thread-pool: true

session:
  security:
    jwt:
      # identity-service's public keys. Fetched on the first request, so session-service starts even
      # while identity is down. In AWS this comes from the environment (the service's internal address).
      jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: buzzer-identity
  websocket:
    # Browser origins allowed to open /ws (checked on the handshake's Origin header). [*] = any port.
    # Comma-separated in the environment: SESSION_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS=https://buzzer.example.com
    allowed-origin-patterns:
      - "http://localhost:[*]"
  live-state:
    # Redis keys of a session expire this long after their last write. Longer than any game night; Postgres
    # keeps the record, so an expired session can still be rebuilt.
    ttl: 6h
  quiz-client:
    # Direct service-to-service call, never through the gateway (the gateway refuses /internal/**).
    base-url: ${QUIZ_SERVICE_URI:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 2s
  outbox:
    # OutboxPublisher: every 300 ms (after the previous run ends), up to 100 of the oldest unsent events.
    poll-interval-ms: 300
    batch-size: 100
    # Total wait for acknowledgements in one run, so also how long a run holds its row locks at most. Longer than
    # spring.kafka.producer.properties.delivery.timeout.ms, so a send fails before we stop waiting.
    send-timeout: 15s
    # Used only when this service creates a topic that doesn't exist yet. 3 on a real multi-broker cluster.
    topic-partitions: 3
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      # One JSON object per line in Elastic Common Schema (ECS): what containers, CloudWatch and any log search get.
      # MDC entries (traceId, sessionId, ...) become fields of the line. For readable lines, the "human" profile below.
      console: ecs

---
# Classic one-line-per-event text for a terminal. .\tasks.ps1 run activates it (unless -Json).
# An empty format means "not structured": Boot falls back to its usual pattern.
spring:
  config:
    activate:
      on-profile: human
logging:
  structured:
    format:
      console: ""
