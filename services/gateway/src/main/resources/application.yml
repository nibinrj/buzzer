spring:
  application:
    name: gateway
  reactor:
    # WebFlux hops between event-loop threads; the trace lives in Reactor's Context, not in a ThreadLocal. "auto" copies
    # it into ThreadLocals (MDC included) around every operator, so the gateway's own log lines carry traceId/spanId.
    context-propagation: auto
  data:
    redis:
      # Non-secret local defaults; the password has no default and must come from the environment.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  cloud:
    gateway:
      server:
        webflux:
          # Per-route timer spring.cloud.gateway.requests (tags: routeId, routeUri, outcome, status, method); off by
          # default. Path tags stay off (their default): raw paths hold session ids, one series per id.
          metrics:
            enabled: true
          # Paths are forwarded unchanged: each service already serves its API under these prefixes.
          # /internal/** is never routed, and InternalPathBlockingFilter 404s it before anything else runs.
          #
          # Every route is rate limited (token bucket in Redis). throw-on-limit turns "over the limit" into an
          # error, so the 429 goes through ProblemDetailExceptionHandler like every other gateway error.
          routes:
            # Anonymous endpoints (login, register, refresh, guest, JWKS): limited per client IP.
            - id: identity
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/.well-known/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.per-ip.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.per-ip.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${gateway.rate-limit.per-ip.requested-tokens}
                    throw-on-limit: true
            - id: quiz
              uri: ${QUIZ_URI:http://localhost:8082}
              predicates:
                - Path=/api/quizzes/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrClientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.per-user.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.per-user.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${gateway.rate-limit.per-user.requested-tokens}
                    throw-on-limit: true
            # /ws/** uses the same http:// target: the gateway switches to ws:// when the request is a
            # WebSocket upgrade. /api/sessions/join and the /ws handshake are public, so they fall back to per-IP.
            # Only the handshake is rate limited: STOMP frames on an open socket are not HTTP requests.
            - id: session
              uri: ${SESSION_URI:http://localhost:8083}
              predicates:
                - Path=/api/sessions/**,/ws/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrClientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.per-user.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.per-user.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${gateway.rate-limit.per-user.requested-tokens}
                    throw-on-limit: true
            - id: scoring
              uri: ${SCORING_URI:http://localhost:8084}
              predicates:
                - Path=/api/results/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrClientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.per-user.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.per-user.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${gateway.rate-limit.per-user.requested-tokens}
                    throw-on-limit: true

gateway:
  security:
    jwt:
      # identity-service's public keys. Fetched on the first authenticated request, so the gateway
      # starts even while identity is down. Same variable as quiz-service.
      jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: buzzer-identity
  # Token buckets: replenish-rate = requests per second on average, burst-capacity = how many at once.
  # Per IP is generous on purpose: a whole pub on one Wi-Fi shares one IP on quiz night.
  # Override per environment, e.g. GATEWAY_RATE_LIMIT_PER_IP_BURST_CAPACITY.
  # requested-tokens = what one request costs. 1 here. Raising it (with burst-capacity scaled to match) allows
  # refill rates below 1 request per second, which whole-number replenish-rate can't express; the tests use that.
  rate-limit:
    per-ip:
      replenish-rate: 2
      burst-capacity: 20
      requested-tokens: 1
    per-user:
      replenish-rate: 10
      burst-capacity: 20
      requested-tokens: 1
  client-ip:
    # Proxies in front of the gateway that append to X-Forwarded-For. 0 locally (the TCP peer is the
    # client); 1 behind the AWS ALB. Anything higher than reality lets clients choose their own IP.
    trusted-proxies: 0
  cors:
    # Browser origins allowed to call the API. [*] = any port. Comma-separated in the environment:
    # GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS=https://buzzer.example.com
    allowed-origin-patterns:
      - "http://localhost:[*]"

server:
  port: 8080

management:
  server:
    # Actuator on a port of its own, never the public one. Prometheus scrapes it; no route, ALB or Ingress exposes
    # it. MANAGEMENT_SERVER_PORT overrides it (Boot relaxed binding), e.g. in a container.
    port: 9080
  endpoint:
    health:
      probes:
        # The liveness/readiness groups ALSO as /livez and /readyz on the service port: a Kubernetes probe (or an ALB
        # health check) then tests the server that carries traffic, not only the management one. Status only.
        add-additional-paths: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # Keep every trace locally. Lower it per environment (MANAGEMENT_TRACING_SAMPLING_PROBABILITY): the root of a
      # trace decides, and every service downstream follows that decision (parent-based sampling).
      probability: 1.0
  # Traces leave over OTLP only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (see .env.example);
  # without it Boot creates no exporter at all.
  otlp:
    metrics:
      export:
        # The OpenTelemetry starter would also PUSH every meter over OTLP. Prometheus pulls them instead.
        enabled: false
  metrics:
    tags:
      # On every meter. Not "instance": Prometheus adds instance (host:port) and job itself when it scrapes.
      application: ${spring.application.name}
    distribution:
      # Fixed histogram buckets instead of percentiles computed in the JVM: bucket counts add up across instances,
      # so Prometheus can compute p95/p99 for the whole service. 10 buckets, 5 ms to 5 s.
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
        # The per-route timer (spring.cloud.gateway.server.webflux.metrics.enabled).
        spring.cloud.gateway.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s

logging:
  structured:
    format:
      # One JSON object per line in Elastic Common Schema (ECS): what containers, CloudWatch and any log search get.
      # MDC entries (traceId, sessionId, ...) become fields of the line. For readable lines, the "human" profile below.
      console: ecs
  level:
    # At DEBUG this filter logs every request header, Authorization included (found by LogSafetyTest). Pinned to INFO,
    # so turning on DEBUG for org.springframework.cloud.gateway to investigate something never prints a token.
    org.springframework.cloud.gateway.filter.headers.observation: INFO

---
# Classic one-line-per-event text for a terminal. .\tasks.ps1 run activates it (unless -Json).
# An empty format means "not structured": Boot falls back to its usual pattern.
spring:
  config:
    activate:
      on-profile: human
logging:
  structured:
    format:
      console: ""
