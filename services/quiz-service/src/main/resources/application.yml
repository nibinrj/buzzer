spring:
  application:
    name: quiz-service
  datasource:
    # Non-secret local defaults; the password has no default and must come from the environment.
    url: ${QUIZ_DB_URL:jdbc:postgresql://localhost:5432/quiz_db}
    username: ${QUIZ_DB_USERNAME:quiz_app}
    password: ${QUIZ_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

quiz:
  security:
    jwt:
      # identity-service's public keys. Fetched on the first request, so quiz-service starts even
      # while identity is down. In AWS this comes from the environment (the service's internal address).
      jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: buzzer-identity

server:
  port: 8082

management:
  server:
    # Actuator on a port of its own, never the public one. Prometheus scrapes it; no route, ALB or Ingress exposes
    # it. MANAGEMENT_SERVER_PORT overrides it (Boot relaxed binding), e.g. in a container.
    port: 9082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # On every meter. Not "instance": Prometheus adds instance (host:port) and job itself when it scrapes.
      application: ${spring.application.name}
    distribution:
      # Fixed histogram buckets instead of percentiles computed in the JVM: bucket counts add up across instances,
      # so Prometheus can compute p95/p99 for the whole service. 10 buckets, 5 ms to 5 s.
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s

logging:
  structured:
    format:
      # One JSON object per line in Elastic Common Schema (ECS): what containers, CloudWatch and any log search get.
      # MDC entries (traceId, sessionId, ...) become fields of the line. For readable lines, the "human" profile below.
      console: ecs

---
# Classic one-line-per-event text for a terminal. .\tasks.ps1 run activates it (unless -Json).
# An empty format means "not structured": Boot falls back to its usual pattern.
spring:
  config:
    activate:
      on-profile: human
logging:
  structured:
    format:
      console: ""
