# Prometheus on the kind cluster (Prometheus + Grafana only: no Jaeger or Loki, the machine's memory budget).
# Same rules and job names as the compose stack (infra/local/observability/prometheus/prometheus.yml), so the
# alerts and dashboards work unchanged. What differs: targets are DISCOVERED from the Kubernetes API, not listed.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml   # the prometheus-rules ConfigMap, generated from the compose stack's rule files

scrape_configs:
  # "buzzer", like compose: the alert up{job="buzzer"} == 0 and the dashboards select on it.
  - job_name: buzzer
    metrics_path: /actuator/prometheus
    kubernetes_sd_configs:
      # role pod: one target per port each container declares. Only the buzzer namespace: that's all the RBAC allows
      # (scrape-access/), and all there is to scrape.
      - role: pod
        namespaces:
          names: [buzzer]
    relabel_configs:
      # Keep the services' management port, chosen by the port's NAME in the Deployments: no prometheus.io/*
      # annotations to keep in sync with the port numbers, and Postgres/Redis/Redpanda/Traefik never match.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component, __meta_kubernetes_pod_container_port_name]
        regex: service;management
        action: keep
      # instance = the pod's name instead of IP:port: pods get new IPs on every restart, and "which pod?" is the
      # question during a chaos run. Unique, because only one port per pod survives the filter above.
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
      # The services already label every meter with application (Micrometer); pod adds which copy.
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Redpanda's own metrics, for the broker-side consumer lag (buzzer:consumer_group_lag). Its stable StatefulSet
  # DNS name, so no discovery needed.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets:
          - redpanda-0.redpanda.buzzer.svc.cluster.local:9644
