# Dev-only Redpanda, Kafka-compatible (in AWS this is MSK, Phase 7). Same image as compose.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  clusterIP: None
  # Publish the pod's DNS name before it's ready. A Kafka client connects to whatever address the broker
  # advertises (redpanda-0.redpanda…, below). Without this the name wouldn't resolve until the pod is ready, and
  # anything that needs the advertised address during startup would wait for itself.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
    - name: admin
      port: 9644
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: broker
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/component: broker
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 101      # the image's "redpanda" user
        runAsGroup: 101
        fsGroup: 101
        runAsNonRoot: true
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
          # One listener: everything that talks to Kafka runs in the cluster. (Compose needed a second one for the
          # services on the host.) The advertised name is the pod's stable StatefulSet DNS name.
          # --memory caps Redpanda's own allocator below the container limit; dev-container mode turns off fsync
          # and the resource checks a production broker needs.
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda-0.redpanda.buzzer.svc.cluster.local:9092
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          # The admin API on localhost: no dependency on DNS or the advertised address.
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            # --memory=512M (above) is Redpanda's own allocator cap, plus ~128Mi for everything outside it. Measured
            # ~117 MiB idle. Was 1Gi: 384Mi nobody used, in a budget where every pod's request is reserved.
            requests:
              cpu: 250m
              memory: 640Mi
            limits:
              memory: 640Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
