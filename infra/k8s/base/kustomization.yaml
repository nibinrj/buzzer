# Environment-neutral: everything that would look the same on any cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - data       # Postgres, Redis, Redpanda
  - gatewayclass.yaml   # cluster-scoped: outside edge/, which sets a namespace
  - edge       # Traefik + the Gateway and HTTPRoute
  - services   # the five services
  - observability   # Prometheus + Grafana in namespace observability (trimmed: no Jaeger, no Loki)
  - scrape-access   # Prometheus may list pods in buzzer (a Role there, so not inside observability/)
