# Which controller implements Gateways: Traefik (edge/traefik.yaml). Cluster-scoped, so it sits here and not in
# edge/: edge's kustomization sets namespace "buzzer", and Kustomize, which can't tell that this custom kind is
# cluster-scoped, would stamp the namespace on it too (the same reason namespaces.yaml is here).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
  labels:
    app.kubernetes.io/part-of: buzzer
spec:
  controllerName: traefik.io/gateway-controller
