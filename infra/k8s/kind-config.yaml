# The local cluster: .\tasks.ps1 kind-up creates it from this file, .\tasks.ps1 kind-down deletes it.
# One node (K.1 D5): control plane and workloads together. Pod deletion, rollouts and HPA behave the same as on
# many nodes; only scheduling across nodes can't be shown.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: buzzer            # kubectl context "kind-buzzer"; every tasks.ps1 command passes it explicitly
nodes:
  - role: control-plane
    # Kubernetes 1.37.0, the default of kind v0.33.0 (the latest stable kind). Pinned by digest so the cluster is
    # the same whichever kind binary creates it.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # The only way in from Windows: Docker publishes a port of the node container (K.1 §8). Fixed at create time;
    # changing it means deleting and recreating the cluster.
    #   localhost:8000 -> node port 30080 -> Traefik (K.4) -> Spring Cloud Gateway
    # listenAddress 127.0.0.1: reachable from this PC only, not from the LAN.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        listenAddress: "127.0.0.1"
        protocol: TCP
