# Every dashboard JSON in infra/local/observability/grafana/dashboards (mounted at /var/lib/grafana/dashboards)
# appears in Grafana's "Buzzer" folder. The files are the source of truth: edits made in the UI can't be saved over
# them (allowUiUpdates: false); export the JSON and commit it instead.
apiVersion: 1

providers:
  - name: buzzer
    folder: Buzzer
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
