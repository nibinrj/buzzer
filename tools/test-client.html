<!doctype html>
<!--
  Buzzer test client: one tab = one user (host or player). No build step, no framework.
  Serve it from http://localhost (file:// sends Origin "null", which the gateway and session-service refuse):
      & "$env:JAVA_HOME\bin\jwebserver.exe" -d (Resolve-Path .\tools).Path -p 5173
  (the JDK's own tiny web server, localhost only) then open http://localhost:5173/test-client.html
  Tokens live in memory only. Server text is rendered with textContent, never innerHTML.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzzer test client</title>
<!-- Pinned version + SRI: the browser refuses the file if jsDelivr ever serves different bytes. Global: StompJs. -->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.3.0/bundles/stomp.umd.min.js"
        integrity="sha384-KkPQpaFjaz1MHqHBmeMM+CCG394NFgCN2Rhe/3Mqnb6/acgNnoWTF54PGijUKRjf"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677084; --line: #d9dde5;
    --accent: #2f6fde; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --log-bg: #11151c; --log-text: #d6dde8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e3e7ee; --muted: #9aa3b5; --line: #2d3442;
      --accent: #6b9cff; --ok: #4cc27f; --warn: #e0a84a; --bad: #ff6b6b; --log-bg: #0b0e13; --log-text: #c9d2df;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
  input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px;
          background: var(--bg); color: var(--text); width: 100%; }
  header input { width: 240px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--accent); border-radius: 5px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 8px; }
  .row > label { flex: 1 1 180px; margin: 0; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid; }
  .pill.off { color: var(--muted); } .pill.on { color: var(--ok); } .pill.wait { color: var(--warn); }
  .room { font: 700 34px/1.1 ui-monospace, monospace; letter-spacing: .12em; margin: 6px 0; }
  .question { font-size: 19px; font-weight: 600; margin: 6px 0 10px; }
  .countdown { font: 700 26px ui-monospace, monospace; }
  .countdown.over { color: var(--bad); }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .options button { background: transparent; color: var(--text); border-color: var(--line); padding: 12px; text-align: left; }
  .options button.chosen { border-color: var(--accent); outline: 2px solid var(--accent); }
  .error { color: var(--bad); font-size: 13px; min-height: 1em; margin-top: 6px; }
  ul.players { margin: 4px 0 0; padding-left: 18px; }
  #log { grid-column: 1 / -1; }
  #logLines { background: var(--log-bg); color: var(--log-text); font: 12px/1.4 ui-monospace, monospace;
              height: 320px; overflow: auto; padding: 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  #logLines .out { color: #7fb2ff; } #logLines .in { color: #8fd694; } #logLines .err { color: #ff8a8a; }
  #logLines .rest { color: #e6c07b; }
</style>
</head>
<body>

<header>
  <h1>Buzzer test client</h1>
  <label class="muted" style="margin:0">Base URL <input id="baseUrl" value="http://localhost:8080"></label>
  <span>
    <label class="muted" style="display:inline;margin:0"><input type="radio" name="role" value="host" checked style="width:auto"> Host</label>
    <label class="muted" style="display:inline;margin:0 0 0 10px"><input type="radio" name="role" value="player" style="width:auto"> Player</label>
  </span>
  <span id="conn" class="pill off">disconnected</span>
</header>

<main>
  <!-- HOST -->
  <section id="hostView">
    <h2>Host</h2>
    <div class="row">
      <label>Email <input id="hostEmail" type="email" autocomplete="username"></label>
      <label>Password <input id="hostPassword" type="password" autocomplete="current-password"></label>
      <button id="hostLogin">Log in</button>
    </div>
    <div class="row">
      <label>Published quiz id <input id="quizId" placeholder="00000000-0000-0000-0000-000000000000"></label>
      <button id="createSession" disabled>Create session</button>
    </div>
    <div id="hostSession" class="hidden">
      <h3>Room code</h3>
      <div id="roomCode" class="room"></div>
      <div class="muted">Session <span id="hostSessionId"></span></div>
      <div class="row">
        <button data-command="start">start</button>
        <button data-command="next">next</button>
        <button data-command="reveal" title="Authorized, but no handler until batch 4.3">reveal</button>
        <button data-command="end">end</button>
        <button id="hostRefresh" class="secondary">Reload state</button>
      </div>
    </div>
    <div id="hostError" class="error"></div>
  </section>

  <!-- PLAYER -->
  <section id="playerView" class="hidden">
    <h2>Player</h2>
    <div class="row">
      <label>Nickname <input id="nickname" maxlength="20"></label>
      <button id="guestLogin">Get guest token</button>
    </div>
    <div class="row">
      <label>Room code <input id="joinCode" maxlength="6" style="text-transform:uppercase"></label>
      <button id="joinSession" disabled>Join</button>
      <button id="playerRefresh" class="secondary" disabled>Reload state</button>
    </div>
    <div id="playerError" class="error"></div>
  </section>

  <!-- GAME (both roles) -->
  <section id="game">
    <h2>Game <span id="gameTitle" class="muted"></span></h2>
    <div>Status: <strong id="status">–</strong> <span id="progress" class="muted"></span></div>
    <div id="questionBox" class="hidden">
      <div class="row" style="justify-content:space-between;align-items:center">
        <span class="muted" id="questionIndex"></span>
        <span id="countdown" class="countdown"></span>
      </div>
      <div id="questionText" class="question"></div>
      <div id="options" class="options"></div>
      <div id="answerNote" class="muted"></div>
    </div>
    <h3>Players</h3>
    <ul id="players" class="players"><li class="muted">(reload state to see the roster)</li></ul>
  </section>

  <!-- LOG -->
  <section id="log">
    <div class="row" style="justify-content:space-between;align-items:center;margin:0 0 8px">
      <h2 style="margin:0">Raw events</h2>
      <span>
        <label class="muted" style="display:inline;margin:0"><input id="verbose" type="checkbox" style="width:auto"> heartbeats and library chatter</label>
        <button id="clearLog" class="secondary">Clear</button>
      </span>
    </div>
    <div id="logLines"></div>
  </section>
</main>

<script>
"use strict";

// ---------- state (memory only: a reload forgets the token on purpose) ----------
const state = {
  token: null,          // access token of this tab's user
  sessionId: null,
  stomp: null,          // StompJs.Client
  deadline: null,       // Date of the running question's deadline
  timer: null,
};

const $ = (id) => document.getElementById(id);
const role = () => document.querySelector('input[name="role"]:checked').value;
const base = () => $("baseUrl").value.trim().replace(/\/+$/, "");

// ---------- log ----------
/** Never let a token reach the screen: blank the Authorization header in anything logged. */
function redact(text) {
  return String(text).replace(/(Authorization\s*:\s*Bearer\s+)\S+/gi, "$1***");
}

function log(kind, text) {
  const line = document.createElement("div");
  line.className = kind;
  line.textContent = new Date().toISOString().substring(11, 23) + "  " + redact(text);
  const box = $("logLines");
  box.appendChild(line);
  while (box.childNodes.length > 800) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

// ---------- REST ----------
/**
 * Calls the API through the base URL (the gateway by default). Logs method, path, status, and the response body
 * except for /api/auth/** (tokens). Request bodies are never logged (passwords). Throws with the ProblemDetail text.
 */
async function api(method, path, body) {
  const headers = { "Accept": "application/json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (state.token && !path.startsWith("/api/auth/")) headers["Authorization"] = "Bearer " + state.token;
  let response;
  try {
    response = await fetch(base() + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch (e) {
    log("err", `${method} ${path} → network error (${e.message}). Is the page served from http://localhost, and the gateway up?`);
    throw new Error("Network error: " + e.message);
  }
  const text = await response.text();
  const json = text ? safeJson(text) : null;
  const shown = path.startsWith("/api/auth/") ? "(body not logged: tokens)" : text;
  log(response.ok ? "rest" : "err", `${method} ${path} → ${response.status} ${shown}`);
  if (!response.ok) {
    const problem = json && (json.detail || json.title);
    throw new Error(problem ? `${response.status}: ${problem}` : `HTTP ${response.status}`);
  }
  return json;
}

function safeJson(text) {
  try { return JSON.parse(text); } catch { return null; }
}

// ---------- STOMP ----------
function setConn(text, cls) {
  const pill = $("conn");
  pill.textContent = text;
  pill.className = "pill " + cls;
}

/**
 * One STOMP connection per tab. The token goes in the CONNECT frame (a browser can't put a header on the
 * WebSocket handshake). Heartbeats 10 s both ways, like the server. On every (re)connect: subscribe again, then
 * reload /state, so a dropped connection redraws whatever it missed.
 */
function connect() {
  disconnect();
  const wsUrl = base().replace(/^http/, "ws") + "/ws";
  const client = new StompJs.Client({
    brokerURL: wsUrl,
    connectHeaders: { Authorization: "Bearer " + state.token },
    heartbeatIncoming: 10000,
    heartbeatOutgoing: 10000,
    reconnectDelay: 5000,
    debug: (text) => {
      const frame = /^(>>>|<<<) /.test(text);
      const heartbeat = /^(>>> PING|<<< PONG)/.test(text);
      if ($("verbose").checked || (frame && !heartbeat)) {
        log(text.startsWith(">>>") ? "out" : "in", text);
      }
    },
    onConnect: () => {
      setConn("connected", "on");
      const topic = "/topic/sessions/" + state.sessionId;
      client.subscribe(topic + "/question", (m) => showQuestion(JSON.parse(m.body)));
      client.subscribe(topic + "/status", (m) => showStatus(JSON.parse(m.body).status));
      client.subscribe("/user/queue/errors", (m) => {
        const error = JSON.parse(m.body);
        showError(`${error.title}: ${error.detail}`);
      });
      reloadState();
    },
    onStompError: (frame) => {
      // The server refused something (bad token, forbidden destination) and closes the connection.
      log("err", "ERROR frame: " + (frame.headers.message || "") + " " + (frame.body || ""));
      showError("Server refused: " + (frame.headers.message || "see log"));
    },
    onWebSocketClose: () => setConn("reconnecting…", "wait"),
  });
  state.stomp = client;
  setConn("connecting…", "wait");
  client.activate();
}

function disconnect() {
  if (state.stomp) {
    state.stomp.deactivate();
    state.stomp = null;
  }
  setConn("disconnected", "off");
}

function send(command) {
  if (!state.stomp || !state.stomp.connected) {
    showError("Not connected.");
    return;
  }
  showError("");
  state.stomp.publish({ destination: `/app/sessions/${state.sessionId}/${command}`, body: "" });
}

// ---------- rendering ----------
function showError(text) {
  $(role() === "host" ? "hostError" : "playerError").textContent = text;
}

function showStatus(status) {
  $("status").textContent = status;
  if (status !== "IN_PROGRESS") hideQuestion();
}

function showQuestion(q) {
  $("questionBox").classList.remove("hidden");
  $("questionIndex").textContent = "Question " + (q.index + 1);
  $("questionText").textContent = q.text;
  $("answerNote").textContent = "";
  const options = $("options");
  options.replaceChildren();
  q.options.forEach((text, i) => {
    const button = document.createElement("button");
    button.textContent = String.fromCharCode(65 + i) + ". " + text;
    if (role() === "player") {
      button.addEventListener("click", () => choose(button, i));
    } else {
      button.disabled = true;
    }
    options.appendChild(button);
  });
  startCountdown(q.deadline);
  $("status").textContent = "IN_PROGRESS";
}

/**
 * Not sent yet: /app/sessions/{id}/answer arrives in batch 4.3. Until then the server's destination check would
 * refuse that SEND and close this player's connection.
 */
function choose(button, index) {
  document.querySelectorAll("#options button").forEach((b) => b.classList.remove("chosen"));
  button.classList.add("chosen");
  $("answerNote").textContent = "Picked option " + index + ". Not sent: answers arrive in batch 4.3.";
  log("rest", `(local) picked option ${index}; nothing sent until batch 4.3`);
}

function hideQuestion() {
  $("questionBox").classList.add("hidden");
  stopCountdown();
}

/** Counts down to the deadline by this browser's clock (the deadline itself is Redis's clock). */
function startCountdown(deadline) {
  stopCountdown();
  state.deadline = deadline ? new Date(deadline) : null;
  const tick = () => {
    if (!state.deadline) { $("countdown").textContent = ""; return; }
    const left = Math.max(0, state.deadline - Date.now());
    const el = $("countdown");
    el.textContent = (left / 1000).toFixed(1) + " s";
    el.classList.toggle("over", left === 0);
  };
  tick();
  state.timer = setInterval(tick, 100);
}

function stopCountdown() {
  if (state.timer) clearInterval(state.timer);
  state.timer = null;
  state.deadline = null;
}

function showPlayers(players) {
  const list = $("players");
  list.replaceChildren();
  if (players.length === 0) {
    const li = document.createElement("li");
    li.className = "muted";
    li.textContent = "(nobody yet)";
    list.appendChild(li);
  }
  players.forEach((p) => {
    const li = document.createElement("li");
    li.textContent = p.displayName;
    list.appendChild(li);
  });
}

/** GET /state: the reconnect path. Redraws status, current question and roster from the server's truth. */
async function reloadState() {
  if (!state.sessionId) return;
  try {
    const s = await api("GET", `/api/sessions/${state.sessionId}/state`);
    $("gameTitle").textContent = "— " + s.quizTitle + " (" + s.roomCode + ")";
    $("progress").textContent = s.questionCount + " questions";
    showStatus(s.status);
    if (s.currentQuestion) {
      showQuestion({ ...s.currentQuestion, deadline: s.questionDeadline });
    }
    showPlayers(s.players);
  } catch (e) {
    showError(e.message);
  }
}

// ---------- host ----------
$("hostLogin").addEventListener("click", async () => {
  try {
    const r = await api("POST", "/api/auth/login", { email: $("hostEmail").value, password: $("hostPassword").value });
    state.token = r.accessToken;
    $("hostPassword").value = "";
    $("createSession").disabled = false;
    showError("");
    log("rest", "host logged in (token kept in memory only)");
  } catch (e) {
    showError(e.message);
  }
});

$("createSession").addEventListener("click", async () => {
  try {
    const r = await api("POST", "/api/sessions", { quizId: $("quizId").value.trim() });
    state.sessionId = r.sessionId;
    $("roomCode").textContent = r.roomCode;
    $("hostSessionId").textContent = r.sessionId;
    $("hostSession").classList.remove("hidden");
    showError("");
    connect();
  } catch (e) {
    showError(e.message);
  }
});

document.querySelectorAll("button[data-command]").forEach((b) =>
  b.addEventListener("click", () => send(b.dataset.command)));
$("hostRefresh").addEventListener("click", reloadState);

// ---------- player ----------
$("guestLogin").addEventListener("click", async () => {
  try {
    const r = await api("POST", "/api/auth/guest", { nickname: $("nickname").value.trim() });
    state.token = r.accessToken;
    $("joinSession").disabled = false;
    showError("");
    log("rest", "guest token received (kept in memory only)");
  } catch (e) {
    showError(e.message);
  }
});

$("joinSession").addEventListener("click", async () => {
  try {
    const r = await api("POST", "/api/sessions/join", { roomCode: $("joinCode").value.trim() });
    state.sessionId = r.sessionId;
    $("playerRefresh").disabled = false;
    showError("");
    connect();
  } catch (e) {
    showError(e.message);
  }
});
$("playerRefresh").addEventListener("click", reloadState);

// ---------- page ----------
/** Switching role starts over: this tab becomes a different user. */
document.querySelectorAll('input[name="role"]').forEach((r) => r.addEventListener("change", () => {
  disconnect();
  hideQuestion();
  Object.assign(state, { token: null, sessionId: null });
  $("hostView").classList.toggle("hidden", role() !== "host");
  $("playerView").classList.toggle("hidden", role() !== "player");
  $("createSession").disabled = true;
  $("joinSession").disabled = true;
  $("playerRefresh").disabled = true;
  $("hostSession").classList.add("hidden");
  $("status").textContent = "–";
  $("gameTitle").textContent = "";
  $("progress").textContent = "";
}));

// The base URL is a per-browser convenience; storage may be unavailable (private window), so never rely on it.
try {
  const saved = localStorage.getItem("buzzer.baseUrl");
  if (saved) $("baseUrl").value = saved;
} catch { /* ignore */ }
$("baseUrl").addEventListener("change", () => {
  try { localStorage.setItem("buzzer.baseUrl", base()); } catch { /* ignore */ }
});

$("clearLog").addEventListener("click", () => $("logLines").replaceChildren());

if (typeof StompJs === "undefined") {
  log("err", "The STOMP library did not load (offline, blocked CDN, or integrity mismatch).");
}
</script>
</body>
</html>
